# config_eval.yaml
student:
  arch: "vit_large" # backbone 名称
  patch_size: 16
  drop_path_rate: 0.0
  pos_embed_rope_base: 10000
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: true
  pos_embed_rope_shift_coords: false
  pos_embed_rope_jitter_coords: false
  pos_embed_rope_rescale_coords: false
  qkv_bias: false
  layerscale: 1e-5
  norm_layer: "nn.LayerNorm"
  ffn_layer: "nn.Linear"
  ffn_bias: true
  proj_bias: true
  n_storage_tokens: 0
  mask_k_bias: false
  untie_cls_and_patch_norms: false
  untie_global_and_local_cls_norm: false
  fp8_enabled: false
  fp8_filter: ""

model:
  backbone_out_layers: "FOUR_EVEN_INTERVALS"  # 可设为 "LAST"、"FOUR_LAST" 或整数列表

crops:
  global_crops_size: 256

pretrained_weights: "/mnt/mydata/DINOv3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"

input_images:
  paths:
    - "/mnt/mydata/hong/masdata"  # TODO: 修改为实际数据根目录
  # dataset_name: "MAS3K"        # TODO: 修改为实际子数据集名称
  # image_subdir: "train/Image"  # 训练默认读取的数据子目录（若不存在会回退）

train:
  batchsize: 12              # 官方默认每卡 64，如显存不足可下调
  num_workers: 4
  steps: 40000              # 官方 100 epoch * 1250 iter
  lora_layers: 24
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.0
  lr: 2.0e-3
  weight_decay: 4.0e-2
  min_lr: 5.0e-5
  image_size: 224
  log_interval: 50
  warmup_steps: 4000        # 10 epoch warmup (1250 iter/epoch)
  warmup_start_lr: 4.0e-4
  grad_accum_steps: 1
  grad_clip_norm: 3.0
  checkpoint_interval: 10000
  checkpoint_dir: "checkpoints"

ssl:
  data:
    local_crops_number: 8
    local_crops_size: 96
    global_crops_scale: [0.32, 1.0]
    local_crops_scale: [0.05, 0.32]
    mask_ratio_min_max: [0.1, 0.5]
    mask_probability: 0.5
    mask_random_circular_shift: false
    share_color_jitter: false
    horizontal_flips: true
    cache_images: false
    cache_max_images: 2000
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 6
  dino:
    head_n_prototypes: 32768
    head_bottleneck_dim: 256
    head_hidden_dim: 2048
    head_nlayers: 3
    head_norm_last_layer: false
    loss_weight: 1.0
    global_ignore_diagonal: true
    student_temp: 0.1
    teacher_temp:
      base: 0.04
      final: 0.07
      warmup_iters: 4000
    center_momentum: 0.9
    koleo_loss_weight: 0.1
    koleo_loss_distributed: false
  ibot:
    head_n_prototypes: 32768
    head_bottleneck_dim: 256
    head_hidden_dim: 2048
    head_nlayers: 3
    head_norm_last_layer: false
    loss_weight: 1.0
    student_temp: 0.1
    center_momentum: 0.9
    mask_sample_probability: 0.5
  koleo:
    loss_weight: 0.1
  ema:
    base: 0.992
    final: 1.0

cosine_viz:
  backbone_out_layers: "LAST"    # 余弦相似度可视化使用的特征层
  layer: null                    # 可指定 Transformer 层索引，null 表示默认
  patch_coords:  null
    # [35, 40]            # 默认取中心 patch，可设为 [i, j]
  cmap: "viridis"                # 颜色映射
  output_dir: "cosine_outputs"   # 热力图输出目录
  device: "cuda"                 # 推理设备，可选 "cuda" / "cpu"
  images:
    - "/home/yangyan/hong/MAS/MAS_MarineFish_Butterflyfish_Com_999.jpg"  # 待可视化的图像路径列表
  resize_to_original: true       # 是否将热力图缩放回原始图像尺寸
  output_scale: null             # 可选缩放倍率，优先于 resize_to_original
  normalize: "local"            # 热力图归一化模式，可选 "global"[0,1] / "local" 按当前热力图最小/最大值重新归一化
